<title>Diez semanas para el estreno</title>
<meta name="description" content="Actividad interactiva: eres escenógrafo de Mentiras, el musical y aprendes los conceptos de escenografía teatral mientras construyes tu maqueta.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: taller en dos columnas. Izquierda: tu maqueta viva (fija en escritorio). Derecha: la escena actual (ficha para aprender + retos). Estética de escenario oscuro con luz ámbar, igual que la presentación. */
:root{
  color-scheme: dark;
  --bg:#141210; --stage:#1c1916; --panel:#221e1a; --line:#3a332c;
  --fg:#f1e9dc; --muted:#b3a894; --faint:#7d7466;
  --accent:#e8a33d; --accent-ink:#1a1206;
  --ok:#7cc59a; --bad:#e3796c;
  --b1:#e8a33d; --b2:#e0847a; --b3:#63b8ad; --b4:#a595e0; --b5:#78a9de;
  --curtain:#6b2229; --curtain-2:#4e171c; --wood:#4a3a2b; --wood-2:#5d4834; --frame:#8a6b3a;
  --cal:#eee7d8; --tierra:#8a5a3a; --olivo:#6f7a3c; --sangre:#8e1f22;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.02;letter-spacing:.01em;text-wrap:balance;margin:0}
p{margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.brand span{color:var(--accent)}
.steps{display:flex;gap:5px;flex:1 1 220px;min-width:0}
.steps button{flex:1;min-width:0;height:8px;border-radius:99px;border:0;background:var(--line);padding:0}
.steps button.done{background:var(--c)}
.steps button.cur{outline:2px solid var(--fg);outline-offset:2px}
.steps button:disabled{cursor:default}
.tb-right{display:flex;gap:8px;align-items:center}
.score{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13.5px;border:1px solid var(--line);padding:6px 12px;border-radius:999px;background:var(--stage);white-space:nowrap}
.score b{color:var(--accent)}
.nb{background:var(--panel);border:1px solid var(--accent);color:var(--fg);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;white-space:nowrap}

/* ---------- Intro ---------- */
.intro{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:center;padding-block:40px}
@media (max-width:820px){.intro{grid-template-columns:1fr;gap:22px;padding-block:28px}}
.intro h1{font-size:clamp(48px,9vw,96px);text-transform:uppercase}
.intro h1 span{color:var(--accent)}
.intro .lead{font-size:19px;color:var(--muted);max-width:46ch;margin-top:14px}
.howto{display:grid;gap:10px;margin-top:20px;padding:0;list-style:none}
.howto li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.howto li span{font-family:var(--f-mono);color:var(--accent)}
.name{display:grid;gap:6px;margin-top:22px;max-width:380px}
.name label{font-size:13px;color:var(--muted)}
.name input{background:var(--stage);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.intro .go{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
.credits{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--faint);display:grid;gap:4px}

/* ---------- Workshop ---------- */
.shop{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:28px;align-items:start;padding-top:22px}
@media (max-width:860px){.shop{grid-template-columns:1fr;gap:18px}}
.model{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:grid;gap:10px}
@media (max-width:860px){.model{position:static}}
.model .box{background:var(--stage);border:1px solid var(--line);border-radius:14px;padding:10px}
.model svg{display:block;width:100%;height:auto}
.model h3{font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ficha-tec{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px;color:var(--muted)}
.ficha-tec li{display:grid;grid-template-columns:14px 1fr;gap:6px}
.ficha-tec li::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--accent);margin-top:7px}
@media (max-width:860px){.ficha-tec{display:none}}

.scene-head{display:grid;gap:8px}
.scene-head .eyebrow{color:var(--c)}
.scene-head h2{font-size:clamp(38px,6vw,58px);text-transform:uppercase}
.scene-head p{color:var(--muted);max-width:60ch;font-size:18px}
.brief{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:14px 16px;font-size:16.5px}
.brief b{color:var(--c)}

.sec-label{margin-top:26px;margin-bottom:10px;display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.sec-label::after{content:"";flex:1;height:1px;background:var(--line)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.cards{grid-template-columns:1fr}}
.cc{background:var(--stage);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;align-content:start}
.cc h4{margin:0;font-size:17px;color:var(--c)}
.cc p{font-size:15.5px;color:var(--fg)}
.cc .ex{font-size:14px;color:var(--muted);font-style:italic}
.spectrum{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);border-top:2px solid var(--c);padding-top:6px}
.readbtn{margin-top:14px;display:flex;justify-content:flex-end}

.task{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;margin-top:12px}
.task .q{font-size:19.5px;font-weight:700;line-height:1.35}
.task .hint{font-size:14.5px;color:var(--muted)}
.tag{justify-self:start;font-family:var(--f-mono);font-size:12px;color:var(--faint)}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--stage);border:1px solid var(--line);border-radius:10px;padding:11px 14px;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--stage))}
.right{border-color:var(--ok)!important;background:color-mix(in srgb,var(--ok) 13%,var(--stage))!important}
.wrong{border-color:var(--bad)!important;background:color-mix(in srgb,var(--bad) 13%,var(--stage))!important}
.mrow{display:grid;gap:8px;background:var(--stage);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mrow .it{display:flex;gap:10px;align-items:center;font-weight:700;line-height:1.35}
.sw{width:26px;height:26px;border-radius:6px;flex:none;border:1px solid rgba(255,255,255,.2)}
.num-badge{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:14px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipb{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14.5px}
.chipb.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--panel))}
.chipb:disabled{cursor:default}
.mrow select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}
.fix{font-size:14px;color:var(--muted)}
.fix b{color:var(--ok)}
.fb{border-left:3px solid var(--ok);padding:4px 0 4px 12px}
.fb.no{border-left-color:var(--bad)}
.fb b{display:block}
.row-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;align-items:center}
.counter{font-family:var(--f-mono);font-size:13px;color:var(--faint)}
.inrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.inrow input{width:110px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-family:var(--f-mono)}
.inrow .unit{font-family:var(--f-mono);color:var(--muted)}
.inrow .btn{padding:9px 14px}
.formula{font-family:var(--f-mono);font-size:14.5px;background:var(--stage);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:3px}
.svgbox{background:var(--stage);border:1px solid var(--line);border-radius:12px;padding:6px}
.svgbox svg{display:block;width:100%;height:auto}

.unlock{margin-top:18px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 16%,var(--panel)),var(--panel));border:1px solid var(--c);border-radius:14px;padding:18px;display:grid;gap:12px}
.unlock h3{font-size:26px;text-transform:uppercase}
.unlock .chips span{background:var(--stage);border:1px solid var(--c);border-radius:999px;padding:4px 12px;font-size:14px}

/* ---------- Notebook overlay ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,7,6,.72);display:flex;justify-content:flex-end}
.drawer{width:min(520px,100%);height:100%;overflow-y:auto;background:var(--bg);border-left:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 30px);display:grid;gap:14px;align-content:start}
.drawer header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.drawer h2{font-size:34px;text-transform:uppercase}
.nb-group h3{font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--c);margin-bottom:8px}
.nb-list{display:grid;gap:6px}
.nb-item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
.nb-item b{display:block;color:var(--fg)}
.nb-item.locked{color:var(--faint);border-style:dashed;background:transparent}

/* ---------- Premiere ---------- */
.premiere{padding-top:26px;display:grid;gap:22px}
.theatre{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--line);background:var(--stage)}
.theatre svg{display:block;width:100%;height:auto}
.theatre .cl,.theatre .cr{position:absolute;top:0;bottom:0;width:50.5%;background:repeating-linear-gradient(90deg,var(--curtain-2) 0 18px,var(--curtain) 18px 36px);transition:transform 1.8s cubic-bezier(.6,.05,.3,1) .3s}
.theatre .cl{left:0}.theatre .cr{right:0}
.theatre.open .cl{transform:translateX(-96%)}.theatre.open .cr{transform:translateX(96%)}
blockquote{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(26px,4.4vw,40px);line-height:1.1;text-wrap:balance}
blockquote cite{display:block;margin-top:8px;font-family:var(--f-body);font-size:15px;font-style:normal;color:var(--muted)}
.ticket{background:var(--fg);color:#1b1610;border-radius:16px;padding:24px;display:grid;gap:14px;
  -webkit-mask:radial-gradient(circle 14px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 14px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 14px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 14px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.ticket .eyebrow{color:#9a5b12}
.ticket h2{font-size:clamp(32px,6vw,50px);text-transform:uppercase}
.ticket table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
.ticket td{padding:6px 0;border-bottom:1px dashed #b9ab93}
.ticket td:last-child{text-align:right;font-family:var(--f-mono)}
.ticket .total td{font-weight:700;border-bottom:0;font-size:18px}
.ticket .who{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
.ticket .stamp{justify-self:end;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:#9a5b12;border:3px solid #9a5b12;border-radius:8px;padding:2px 12px;transform:rotate(-4deg)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
(function(){
"use strict";

/* ================= Conceptos del cuaderno ================= */
const BLOCKS={1:{n:"¿Qué es la escenografía?",c:"var(--b1)"},2:{n:"Tipos de escenografía",c:"var(--b2)"},3:{n:"Elementos de la escenografía",c:"var(--b3)"},4:{n:"El escenógrafo y su proceso",c:"var(--b4)"},5:{n:"Dibujo escénico y técnica",c:"var(--b5)"}};
const C={
  esc:{b:1,t:"Escenografía",d:"El espacio escénico recreado según la lectura que dirección hace del texto. No es decorar el fondo: es construir el mundo de la obra."},
  origen:{b:1,t:"Origen del término",d:"Pintura de escenas y dibujo arquitectónico en perspectiva. Por siglos fue una imagen pintada vista de frente."},
  kin:{b:1,t:"De mirar a habitar",d:"En el siglo XX pasa de estática y pictórica a dinámica y kinestésica: se sube, se recorre, se toca."},
  hab:{b:1,t:"Habitabilidad (João Mendes Ribeiro)",d:"Crear espacios con los que los cuerpos de quienes actúan puedan interactuar. Se piensa en 3D, como arquitectura."},
  svo:{b:1,t:"Josef Svoboda",d:"«La verdadera escenografía es lo que sucede cuando se abre el telón». Se juzga en la función, no en el boceto."},
  fun:{b:1,t:"Cuatro funciones",d:"Sitúa (dónde y cuándo), comunica (tono y emoción), resuelve (entradas, salidas, cambios, seguridad) y transforma (cambia con la historia)."},
  desg:{b:4,t:"Desglose",d:"Lista de todo lo que pide la obra: lugares, momento del día, entradas y salidas, objetos, cambios y acotaciones. Se lee como lector y luego como técnico."},
  junta:{b:4,t:"Junta con dirección",d:"Dirección da ideas abstractas; el escenógrafo pregunta y lleva referencias. Propone, pero después de entender."},
  trad:{b:4,t:"Traducir una idea",d:"Una palabra abstracta se vuelve decisiones concretas de proporción, color y circulación (aire)."},
  idoc:{b:4,t:"Investigación documental",d:"Cómo era ese mundo: arquitectura, texturas, luz, pintura de la época."},
  iemo:{b:4,t:"Investigación emocional",d:"Imágenes no literales que transmiten el concepto. Ver otros montajes sirve, pero si solo partes de ahí terminas copiando."},
  paleta:{b:4,t:"Paleta con razones",d:"Cada color se justifica desde la obra. Si no hay razón, no va."},
  t_real:{b:2,t:"Realista",d:"Fiel, literal y llena de detalles: el público reconoce el lugar de inmediato."},
  t_nat:{b:2,t:"Naturalista",d:"Actuación y espacio parecen la vida misma, tras una cuarta pared invisible."},
  t_pint:{b:2,t:"Pintada",d:"Telones y paneles pintados de frente al público; se sustituyen entre escenas."},
  t_rom:{b:2,t:"Romántica",d:"Atmósfera lúgubre y tenebrosa del Romanticismo (1790–1830): ruinas, noche, luna."},
  t_fun:{b:2,t:"Funcional",d:"Al servicio de los movimientos: plataformas, escaleras y rampas que crean niveles."},
  t_sug:{b:2,t:"Sugerente",d:"Uno o pocos objetos cargados de sentido; el público completa el resto."},
  t_min:{b:2,t:"Minimalista",d:"Lo estrictamente indispensable. Exige más a los actores."},
  t_abs:{b:2,t:"Abstracta",d:"Formas, color y luz sin lugar ni tiempo: sugiere sensaciones."},
  deco:{b:3,t:"Decorado",d:"Todo lo que forma el espacio: fijo (muros, techo, columnas) y móvil (telones, carros, proyecciones)."},
  util:{b:3,t:"Utilería",d:"Objetos que el actor toca y usa. Literal (una pluma para escribir) o simbólica (un reloj detenido)."},
  ilum:{b:3,t:"Iluminación",d:"Crea atmósfera, destaca objetos o personajes y guía la mirada. Una luz muy tenue puede sugerir la muerte."},
  vest:{b:3,t:"Vestuario y maquillaje",d:"Muestran quién es el personaje y cómo cambia."},
  arte:{b:3,t:"Arte escénico",d:"Pintura y texturas: trampantojo (profundidad pintada sobre lo plano) y mapping (proyectar sobre superficies)."},
  tecn:{b:3,t:"Piezas técnicas",d:"Tramoya (mueve cambios y efectos), soportes (peso), plataformas (niveles), tarimas (elevan el piso), carros (ruedas), bastidores (marcos forrados)."},
  bast:{b:3,t:"Bastidor: dos usos",d:"La pieza (marco forrado que forma muros) y el lugar oculto donde se preparan los actores: «entre bastidores»."},
  boceto:{b:4,t:"Boceto",d:"A mano alzada; explora atmósfera, composición y medidas aproximadas."},
  maq:{b:4,t:"Maqueta",d:"El escenario en 3D, siempre con una figura humana a escala. Escalas comunes: 1:25 y 1:50."},
  presu:{b:4,t:"Presupuesto",d:"Conserva el elemento que sostiene el concepto, simplifica lo demás y reutiliza lo de bodega."},
  planos:{b:5,t:"Juego de planos",d:"Planta básica, plano compuesto, sección y alzados frontales. Si no está en el plano, no existe."},
  italiana:{b:5,t:"Teatro a la italiana",d:"Vara, tramoya, bambalina, pierna, embocadura, ciclorama, hombro, proscenio y foso."},
  ensayo:{b:4,t:"Ensayo técnico",d:"El diseño se enfrenta a la realidad: se ajustan tiempos de cambio, luz y seguridad con todo el equipo."},
  decis:{b:4,t:"Decisiones externas e internas",d:"Externas: lo que ve el público. Internas: el espacio entre bastidores para que actores y tramoyistas trabajen."},
  consid:{b:4,t:"El escenógrafo también considera",d:"Bloqueo, pirotecnia, trampillas, grandes conjuntos y baile."},
  config:{b:5,t:"Tamaño y forma del espacio",d:"Proscenio (de frente), empuje (tres frentes), arena (cuatro frentes) y espacios no convencionales."},
  rider:{b:4,t:"Rider técnico",d:"Describe medidas, varas, piso y carga de cada teatro. Por eso los diseños de gira suelen ser modulares."},
  efectos:{b:5,t:"Efectos especiales",d:"Trampillas, ascensores, proyecciones o pirotecnia: todo efecto pide seguridad y cabe en presupuesto y técnica."}
};
const C_TOTAL=Object.keys(C).length;

/* ================= Escenas ================= */
const TYPES8=["Realista","Naturalista","Pintada","Romántica","Funcional","Sugerente","Minimalista","Abstracta"];
const ANAT=["Bambalina","Ciclorama","Embocadura","Foso","Hombro","Pierna","Proscenio","Tramoya","Vara"];

const SC=[
 {id:"e1",b:1,week:"Semana 0",title:"Antes de abrir el telón",sub:"Te acaban de contratar. Antes de diseñar, necesitas saber qué es (y qué no es) la escenografía.",
  brief:"<b>El encargo:</b> una compañía hará un nuevo montaje de <i>Mentiras, el musical</i> de José Manuel López Velarde (estrenado en 2009). Tú diseñas la escenografía y el estreno es en diez semanas.",
  learn:["esc","origen","kin","hab","svo","fun"],
  tasks:[
   {id:"e1a",type:"match",q:"El espacio habla primero. Así está el escenario vacío del ensayo. ¿Qué comunica cada elemento?",hint:"Nada está en escena por casualidad.",opts:["Encierro","Aislamiento","Amenaza o expectativa","Ausencia"],
    items:[{t:"Un muro alto sin ventanas",a:"Encierro"},{t:"Una luz cenital sobre un solo punto",a:"Aislamiento"},{t:"Una sola puerta, cerrada",a:"Amenaza o expectativa",e:"¿Quién entrará?"},{t:"Una silla rota",a:"Ausencia",e:"Algo pasó."}]},

/* ================= Estado ================= */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fresh(){const ord={};SC.forEach(s=>s.tasks.forEach(t=>{if(t.type==="mc")ord[t.id]=shuffle(t.o.map((_,k)=>k));if(t.type==="match"&&!t.svg)ord[t.id]=shuffle(t.items.map((_,k)=>k));}));
  return {view:"intro",cur:0,name:"",read:{},T:{},ord,nb:false};}
let S=(window.claude&&window.claude.hot&&window.claude.hot.data&&window.claude.hot.data.S)||fresh();
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({S}));}catch(e){}

const T=id=>S.T[id]||(S.T[id]={ans:{},done:false,score:0,res:{}});
function taskDone(t){return !!(S.T[t.id]&&S.T[t.id].done);}
function sceneDone(i){return SC[i].tasks.every(taskDone);}
function sceneScore(i){return SC[i].tasks.reduce((s,t)=>s+(S.T[t.id]?S.T[t.id].score:0),0);}
function scenePts(i){return SC[i].tasks.reduce((s,t)=>s+t.pts,0);}
function totalScore(){return SC.reduce((s,_,i)=>s+sceneScore(i),0);}
function unlocked(){const u=new Set();SC.forEach((s,i)=>{if(sceneDone(i))s.learn.forEach(c=>u.add(c));});return u;}
function maxOpen(){let i=0;while(i<SC.length&&sceneDone(i))i++;return i;} // primera escena sin terminar

      s+=`<rect x="${x}" y="78" width="62" height="120" fill="${c}" opacity=".12"/><rect x="${x}" y="78" width="62" height="120" fill="none" stroke="${c}" stroke-width="3" filter="url(#glow)"/>`;
      if(d(5)) s+=`<rect x="${x-2}" y="198" width="66" height="6" fill="#2a2520"/><circle cx="${x+8}" cy="206" r="3.5" fill="#1b1714" stroke="#7d7466"/><circle cx="${x+54}" cy="206" r="3.5" fill="#1b1714" stroke="#7d7466"/>`;

    s+=`<g fill="#f1e9dc" opacity=".92"><circle cx="71" cy="120" r="7"/><path d="M64 130 h14 l5 30 h-6 l-2 -14 l-2 38 h-4 l-1 -30 l-1 30 h-4 l-2 -38 l-2 14 h-6z"/></g>

  const items=SC.filter((_,i)=>sceneDone(i)).map(s=>`<li>${esc(s.ficha)}</li>`).join("");
  return `<aside class="model"><h3>Tu maqueta · Mentiras</h3><div class="box">${maqueta()}</div>
  ${items?`<ul class="ficha-tec" aria-label="Ficha técnica">${items}</ul>`:""}</aside>`;
}

/* ================= Barra superior ================= */
function topbar(){
  const mo=maxOpen(), u=unlocked().size;
  const dots=SC.map((s,i)=>`<button style="--c:${BLOCKS[s.b].c}" class="${sceneDone(i)?"done":""} ${S.view==="scene"&&S.cur===i?"cur":""}" ${i<=mo?"":"disabled"} data-scene="${i}" aria-label="Escena ${i+1}: ${esc(s.title)}"></button>`).join("");
  return `<div class="topbar"><span class="brand">Diez semanas <span>para el estreno</span></span>
    <div class="steps">${dots}</div>
    <div class="tb-right"><span class="score"><b>${totalScore()}</b>/${TOTAL}</span><button class="nb" id="nbopen">Cuaderno ${u}/${C_TOTAL}</button></div></div>`;
}

/* ================= Intro ================= */
function viewIntro(){
  app.innerHTML=`<section class="intro">
    <div>
      <span class="eyebrow">DVUE · Diseño de escenografía en el teatro</span>
      <h1>Diez semanas <span>para el estreno</span></h1>
      <p class="lead">Una compañía va a montar <i>Mentiras, el musical</i> y tú diseñas la escenografía. Recorre el proceso completo, del desglose a la gira, y aprende los conceptos del tema mientras construyes tu maqueta.</p>
      <ol class="howto">
        <li><span>01</span><div>En cada escena lees la <b>ficha de conceptos</b>.</div></li>
        <li><span>02</span><div>Resuelves los <b>retos</b>. Si fallas, te mostramos la respuesta y por qué.</div></li>
        <li><span>03</span><div>Cada escena terminada suma piezas a tu <b>maqueta</b> y conceptos a tu <b>cuaderno</b>.</div></li>
      </ol>
      <div class="name"><label for="nm">Tu nombre (aparece en tu boleto del estreno)</label><input id="nm" type="text" autocomplete="name" placeholder="Nombre y apellido" value="${esc(S.name)}"></div>
      <div class="go"><button class="btn" id="start">${maxOpen()>0?"Continuar":"Empezar el encargo"}</button>${maxOpen()>=SC.length?`<button class="btn ghost" id="toPrem">Ir al estreno</button>`:""}</div>
    </div>
    ${modelPanel().replace('class="model"','class="model" style="position:static"')}
  </section>`;
  const nm=document.getElementById("nm"); nm.oninput=()=>{S.name=nm.value;};
  document.getElementById("start").onclick=()=>{S.cur=Math.min(maxOpen(),SC.length-1);S.view=maxOpen()>=SC.length?"premiere":"scene";render();top0();};
  const tp=document.getElementById("toPrem"); if(tp) tp.onclick=()=>{S.view="premiere";render();top0();};
}

/* ================= Retos ================= */
function renderTask(t,i){
  const st=T(t.id), done=st.done;
  let body="";
  if(t.type==="mc"){
    const ord=S.ord[t.id];
    body=`<div class="opts">${ord.map(k=>{let c="opt";if(done){if(k===t.a)c+=" right";else if(k===st.ans.v)c+=" wrong";}
      return `<button class="${c}" data-mc="${t.id}" data-k="${k}" ${done?"disabled":""}>${esc(t.o[k])}</button>`;}).join("")}</div>`;
    if(done) body+=fb(st.score===1,t.e);
  }
  else if(t.type==="multi"){
    const sel=st.ans.sel||[];
    body=`<div class="chips">${t.o.map((o,k)=>{let c="chipb"+(sel.includes(k)?" sel":"");if(done){if(t.a.includes(k))c+=" right";else if(sel.includes(k))c+=" wrong";}
      return `<button class="${c}" data-mu="${t.id}" data-k="${k}" ${done?"disabled":""} aria-pressed="${sel.includes(k)}">${esc(o)}</button>`;}).join("")}</div>`;
    body+= done?fb(st.score===1,t.e):`<div class="row-actions"><span class="counter">${sel.length}/${t.a.length} elegidos</span><button class="btn" data-check="${t.id}" ${sel.length===t.a.length?"":"disabled"}>Comprobar</button></div>`;
  }
  else if(t.type==="match"){
    const ord=S.ord[t.id]||t.items.map((_,k)=>k);
    const rows=ord.map(k=>{const it=t.items[k], opts=it.opts||t.opts, v=st.ans[k];
      const cls=done?(v===it.a?"right":"wrong"):"";
      let ctrl;
      if(opts.length<=6){ctrl=`<div class="chips">${opts.map(o=>`<button class="chipb ${v===o?"sel":""}" data-ma="${t.id}" data-i="${k}" data-v="${esc(o)}" ${done?"disabled":""} aria-pressed="${v===o}">${esc(o)}</button>`).join("")}</div>`;}
      else{ctrl=`<select data-ms="${t.id}" data-i="${k}" ${done?"disabled":""} aria-label="${esc(it.t)}"><option value="">Elige…</option>${opts.map(o=>`<option ${v===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`;}
      const lead=t.svg?`<span class="num-badge">${esc(it.t)}</span>`:(it.sw?`<span class="sw" style="background:${it.sw}"></span>`:"");
      const label=t.svg?"":esc(it.t);
      const fix=done?`<div class="fix">${v===it.a?"":`Correcto: <b>${esc(it.a)}</b>. `}${it.e?esc(it.e):""}</div>`:"";
      return `<div class="mrow ${cls}"><div class="it">${lead}${label}</div>${ctrl}${(done&&(v!==it.a||it.e))?fix:""}</div>`;}).join("");
    const filled=t.items.filter((_,k)=>st.ans[k]).length;
    body=(t.svg?`<div class="svgbox">${stageSVG()}</div>`:"")+`<div class="opts" ${t.svg?'style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr))"':""}>${rows}</div>`;
    body+= done?fb(st.score===t.items.length,`${st.score} de ${t.items.length} correctas.`,true)
      :`<div class="row-actions"><span class="counter">${filled}/${t.items.length}</span><button class="btn" data-check="${t.id}" ${filled===t.items.length?"":"disabled"}>Comprobar</button></div>`;
  }
  else if(t.type==="num"){
    body=`<div class="formula">${t.formula.map(f=>`<span>${esc(f)}</span>`).join("")}</div>`+t.items.map((it,k)=>{
      const r=st.res[k]||{}; const solved=r.ok||r.shown;
      return `<div class="mrow ${r.ok?"right":(r.shown?"wrong":"")}"><div class="it" style="font-weight:400">${k+1}. ${esc(it.q)}</div>
      <div class="inrow"><input id="n-${t.id}-${k}" inputmode="decimal" value="${esc(r.v||"")}" ${solved?"disabled":""} aria-label="Respuesta ${k+1}"><span class="unit">${it.u}</span>${solved?"":`<button class="btn" data-num="${t.id}" data-i="${k}">Comprobar</button>`}</div>
      ${r.ok?`<div class="fix"><b>${r.tries===1?"¡Exacto!":"Ahora sí."}</b> ${esc(it.e)}</div>`:r.shown?`<div class="fix">Era <b>${it.a} ${it.u}</b>. ${esc(it.e)}</div>`:r.tries?`<div class="fix" style="color:var(--bad)">Revisa: ¿pasaste los metros a centímetros? Intenta otra vez.</div>`:""}</div>`;}).join("");
  }
  return `<div class="task" id="task-${t.id}"><span class="tag">Reto ${i+1} de ${SC[S.cur].tasks.length}</span><p class="q">${esc(t.q)}</p>${t.hint?`<p class="hint">${esc(t.hint)}</p>`:""}${body}</div>`;
}
function fb(ok,text,match){return `<div class="fb ${ok?"":"no"}" role="status"><b>${ok?"¡Bien!":match?"Revisa las correcciones.":"No exactamente."}</b>${esc(text)}</div>`;}

/* ================= Escena ================= */
function viewScene(){
  const i=S.cur, s=SC[i], c=BLOCKS[s.b].c, read=!!S.read[s.id], done=sceneDone(i);
  const cards=s.learn.map(id=>`<div class="cc" style="--c:${BLOCKS[C[id].b].c}"><h4>${esc(C[id].t)}</h4><p>${esc(C[id].d)}</p></div>`).join("")+
    (s.spectrum?`<div class="spectrum"><span>← Imita un lugar</span><span>Transmite una idea →</span></div>`:"");
  let tasksHtml="";
  if(read){ for(let k=0;k<s.tasks.length;k++){ tasksHtml+=renderTask(s.tasks[k],k); if(!taskDone(s.tasks[k])) break; } }
  const next=i+1<SC.length;
  const unlock=done?`<div class="unlock" style="--c:${c}"><span class="eyebrow" style="color:${c}">Escena completa · ${sceneScore(i)}/${scenePts(i)}</span>
     <h3>Nuevo en tu cuaderno</h3><div class="chips">${s.learn.map(id=>`<span>${esc(C[id].t)}</span>`).join("")}</div>
     <div class="row-actions">${next?`<button class="btn" id="nextScene">Siguiente: ${esc(SC[i+1].title)}</button>`:`<button class="btn" id="goPrem">¡Al estreno!</button>`}</div></div>`:"";
  app.innerHTML=topbar()+`<div class="shop">${modelPanel()}<main style="--c:${c};min-width:0">
    <header class="scene-head"><span class="eyebrow">Escena ${i+1} · ${esc(s.week)} · ${esc(BLOCKS[s.b].n)}</span><h2>${esc(s.title)}</h2><p>${esc(s.sub)}</p></header>
    <div class="brief">${s.brief}</div>
    <div class="sec-label">Ficha de conceptos</div>
    <div class="cards">${cards}</div>
    ${read?`<div class="sec-label">Retos</div>${tasksHtml}${unlock}`:`<div class="readbtn"><button class="btn" id="readOk">Ya lo leí: a los retos</button></div>`}
  </main></div>`;
  bindScene();
}

function bindScene(){
  const s=SC[S.cur];
  const find=id=>s.tasks.find(t=>t.id===id);
  const ro=document.getElementById("readOk"); if(ro) ro.onclick=()=>{S.read[s.id]=true;render();const el=document.querySelector(".task");if(el)el.scrollIntoView({block:"start",behavior:"smooth"});};
  app.querySelectorAll("[data-mc]").forEach(b=>b.onclick=()=>{const t=find(b.dataset.mc),st=T(t.id);st.ans.v=Number(b.dataset.k);st.score=st.ans.v===t.a?1:0;st.done=true;afterTask(t);});
  app.querySelectorAll("[data-mu]").forEach(b=>b.onclick=()=>{const t=find(b.dataset.mu),st=T(t.id),k=Number(b.dataset.k);st.ans.sel=st.ans.sel||[];const p=st.ans.sel.indexOf(k);if(p>=0)st.ans.sel.splice(p,1);else if(st.ans.sel.length<t.a.length)st.ans.sel.push(k);keep(()=>render(),b);});
  app.querySelectorAll("[data-ma]").forEach(b=>b.onclick=()=>{const st=T(b.dataset.ma);st.ans[b.dataset.i]=b.dataset.v;keep(()=>render(),b);});
  app.querySelectorAll("[data-ms]").forEach(sel=>sel.onchange=()=>{const st=T(sel.dataset.ms);st.ans[sel.dataset.i]=sel.value;keep(()=>render(),sel);});
  app.querySelectorAll("[data-check]").forEach(b=>b.onclick=()=>{const t=find(b.dataset.check),st=T(t.id);
    if(t.type==="multi"){const sel=(st.ans.sel||[]).slice().sort().join(),a=t.a.slice().sort().join();st.score=sel===a?1:0;}
    else st.score=t.items.reduce((n,it,k)=>n+(st.ans[k]===it.a?1:0),0);
    st.done=true;afterTask(t);});
  app.querySelectorAll("input[id^=n-]").forEach(inp=>{inp.onkeydown=e=>{if(e.key==="Enter"){const b=inp.parentElement.querySelector("[data-num]");if(b)b.click();}};});
  app.querySelectorAll("[data-num]").forEach(b=>b.onclick=()=>{const t=find(b.dataset.num),st=T(t.id),k=Number(b.dataset.i),it=t.items[k];
    const inp=document.getElementById(`n-${t.id}-${k}`);const v=parseFloat(String(inp.value).replace(",",".").replace(/[^\d.\-]/g,""));if(isNaN(v))return;
    const r=st.res[k]||(st.res[k]={tries:0});r.tries++;r.v=inp.value;
    if(Math.abs(v-it.a)<0.051){r.ok=true;if(r.tries===1)st.score++;}else if(r.tries>=2){r.shown=true;}
    if(t.items.every((_,j)=>st.res[j]&&(st.res[j].ok||st.res[j].shown))){st.done=true;afterTask(t);return;}
    keep(()=>render(),b);const nx=document.getElementById(`n-${t.id}-${k+1}`);if(r.ok&&nx)nx.focus({preventScroll:true});});
  const ns=document.getElementById("nextScene"); if(ns) ns.onclick=()=>{S.cur++;render();top0();};
  const gp=document.getElementById("goPrem"); if(gp) gp.onclick=()=>{S.view="premiere";render();top0();};
}
/* mantiene la posición de scroll al re-renderizar */
function keep(fn,el){const id=el&&el.closest(".task")?el.closest(".task").id:null;const y=id?document.getElementById(id).getBoundingClientRect().top:0;fn();if(id){const n=document.getElementById(id);if(n)window.scrollBy(0,n.getBoundingClientRect().top-y);}}
function afterTask(t){
  const id="task-"+t.id; const y=document.getElementById(id).getBoundingClientRect().top;
  render();
  const n=document.getElementById(id); if(n) window.scrollBy(0,n.getBoundingClientRect().top-y);
}

/* ================= Estreno ================= */
function viewPremiere(){
  const d=new Date().toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"});
  const t=totalScore(), pct=Math.round(t/TOTAL*100), u=unlocked().size, all=maxOpen()>=SC.length;
  const rows=SC.map((s,i)=>`<tr><td>${i+1}. ${esc(s.title)}${sceneDone(i)?"":" <em style='color:#9a5b12'>(pendiente)</em>"}</td><td>${sceneScore(i)}/${scenePts(i)}</td></tr>`).join("");
  app.innerHTML=topbar()+`<section class="premiere">
    <div><span class="eyebrow">Noche de estreno</span><h2 style="font-size:clamp(44px,8vw,80px);text-transform:uppercase;margin-top:6px">Se abre el telón</h2></div>
    <div class="theatre" id="th">${maqueta()}<div class="cl"></div><div class="cr"></div></div>
    <blockquote>«La verdadera escenografía es lo que sucede cuando se abre el telón.»<cite>Josef Svoboda</cite></blockquote>
    <section class="ticket" aria-label="Boleto del estreno">
      <span class="eyebrow">DVUE · Mentiras, el musical · Escenografía</span>
      <h2>Boleto de salida</h2>
      <div class="who"><b>${esc(S.name.trim()||"Sin nombre")}</b><span>${d}</span></div>
      <table>${rows}<tr class="total"><td>Total</td><td>${t}/${TOTAL} · ${pct}%</td></tr><tr><td>Conceptos en el cuaderno</td><td>${u}/${C_TOTAL}</td></tr></table>
      ${all?`<span class="stamp">Función completa</span>`:""}
    </section>
    <div class="row-actions" style="justify-content:flex-start">
      ${S.name.trim()?"":`<span class="muted" style="font-size:15px">Escribe tu nombre en la portada para que aparezca en tu boleto.</span>`}
      <button class="btn" id="nb2">Repasar mi cuaderno</button><button class="btn ghost" id="home">Portada</button><button class="btn ghost" id="reset">Empezar de nuevo</button>
    </div>
    <p id="rq" class="muted" hidden>¿Seguro? Se borran tus respuestas. <button class="btn ghost" id="resetYes" style="padding:6px 12px">Sí, borrar</button></p>
    <p class="muted" style="font-size:15px">Toma captura de pantalla de tu boleto si tu profesora te lo pide.</p>
  </section>`;
  requestAnimationFrame(()=>setTimeout(()=>{const th=document.getElementById("th");if(th)th.classList.add("open");},60));
  document.getElementById("nb2").onclick=()=>{S.nb=true;renderNB();};
  document.getElementById("home").onclick=()=>{S.view="intro";render();top0();};
  document.getElementById("reset").onclick=()=>{document.getElementById("rq").hidden=false;};
  document.getElementById("resetYes").onclick=()=>{const n=S.name;S=fresh();S.name=n;render();top0();};
}

/* ================= Cuaderno ================= */
function renderNB(){
  if(!S.nb){ov.innerHTML="";return;}
  const u=unlocked();
  const groups=[1,2,3,4,5].map(b=>{const ids=Object.keys(C).filter(id=>C[id].b===b);
    return `<div class="nb-group" style="--c:${BLOCKS[b].c}"><h3>${esc(BLOCKS[b].n)}</h3><div class="nb-list">${ids.map(id=>u.has(id)?`<div class="nb-item"><b>${esc(C[id].t)}</b>${esc(C[id].d)}</div>`:`<div class="nb-item locked">Por descubrir</div>`).join("")}</div></div>`;}).join("");
  ov.innerHTML=`<div class="overlay" id="ovbg"><div class="drawer" role="dialog" aria-modal="true" aria-label="Cuaderno del escenógrafo">
    <header><div><span class="eyebrow">${u.size} de ${C_TOTAL} conceptos</span><h2>Mi cuaderno</h2></div><button class="btn ghost" id="nbclose">Cerrar</button></header>
    <p class="muted" style="font-size:15px">Los conceptos se agregan al terminar cada escena. Úsalo para estudiar antes del examen.</p>${groups}</div></div>`;
  document.getElementById("nbclose").onclick=()=>{S.nb=false;renderNB();};
  document.getElementById("ovbg").onclick=e=>{if(e.target.id==="ovbg"){S.nb=false;renderNB();}};
  document.getElementById("nbclose").focus();
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.nb){S.nb=false;renderNB();}});

function render(){
  if(S.view==="intro") viewIntro(); else if(S.view==="premiere") viewPremiere(); else viewScene();
  const nb=document.getElementById("nbopen"); if(nb) nb.onclick=()=>{S.nb=true;renderNB();};
  app.querySelectorAll("[data-scene]").forEach(b=>b.onclick=()=>{S.cur=Number(b.dataset.scene);S.view="scene";render();top0();});
  const br=app.querySelector(".brand"); if(br){br.style.cursor="pointer";br.onclick=()=>{S.view="intro";render();top0();};}
  renderNB();
}
render();
})();
</script>
